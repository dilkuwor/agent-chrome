<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cursor Gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glow in Center -->
  <circle cx="64" cy="64" r="44" fill="url(#coreGlow)" />

  <!-- Outer Orbital Browser Ring (Segmented / Dynamic) -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="175 40" transform="rotate(-40 64 64)" filter="url(#glow)" />

  <!-- Secondary Orbital Accent Arc -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="28 190" transform="rotate(130 64 64)" />

  <!-- Inner Concentric Orbit -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Central Agent Pointer / Stealth Cursor -->
  <g filter="url(#cursorShadow)">
    <!-- Cursor Body -->
    <path d="M46 36 L86 64 L67 68 L78 90 L67 95 L56 73 L46 82 Z" fill="url(#cursorGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Sleek inner highlight on cursor -->
    <path d="M49 42 L77 62 L64 65 Z" fill="#93c5fd" opacity="0.75" />
  </g>

  <!-- Glowing Sensor Node (top right of ring) -->
  <circle cx="95" cy="39" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="95" cy="39" r="2" fill="#ffffff" />
</svg>
