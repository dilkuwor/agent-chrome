<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grok in Chrome</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div>
      <h1>Grok in Chrome</h1>
      <p class="sub">Grok and AGY drive this browser</p>
    </div>
    <p id="status" class="status offline">Offline</p>
  </header>

  <section id="pending" class="pending hidden">
    <p id="pending-text"></p>
    <div class="row">
      <button id="allow" type="button">Allow</button>
      <button id="deny" type="button" class="ghost">Deny</button>
    </div>
  </section>

  <section>
    <h2>Pairing</h2>
    <p class="hint">Token file: ~/.grok-in-chrome/token</p>
    <p id="token-state" class="hint">No token yet</p>
    <input id="token" type="text" autocomplete="off" spellcheck="false" placeholder="Paste pairing token">
    <label class="hint" for="port">Port</label>
    <input id="port" type="number" value="47321" min="1" max="65535">
    <div class="row">
      <button id="save-token" type="button">Save</button>
      <label class="ghost file">Choose file<input id="token-file" type="file"></label>
    </div>
  </section>

  <section>
    <h2>This tab</h2>
    <p id="site" class="site">No website in this tab.</p>
    <button id="allow-site" type="button" class="ghost">Allow this site</button>
  </section>

  <section>
    <label class="check"><input id="allow-all" type="checkbox"> Allow every site</label>
    <p class="hint">The agent can then use any site where you are signed in.</p>
  </section>

  <section>
    <h2>Allowed</h2>
    <ul id="allowed"></ul>
  </section>

  <section>
    <h2>Activity</h2>
    <ul id="activity"></ul>
  </section>
  <script src="sidepanel.js"></script>
</body>
</html>
